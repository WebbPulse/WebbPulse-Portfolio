name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v2
    with:
      python-version: "3.13"
      working-directory: backend
      ruff-target: "app tests"
      coverage-source: app
      pytest-args: ""
      codeartifact-domain: webbpulse
      codeartifact-repository: python
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      id-token: write
      contents: read
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v2
    with:
      node-version: "20"
      working-directory: frontend
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: ""
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
