name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

jobs:
  resolve-env:
    name: Resolve deploy environment
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      s3-bucket: ${{ vars.SITE_S3_BUCKET }}
      cloudfront-distribution-id: ${{ vars.SITE_CLOUDFRONT_DISTRIBUTION_ID }}
      role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Pick the environment and check its variables
        id: pick
        env:
          SITE_S3_BUCKET: ${{ vars.SITE_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_S3_BUCKET" ]; then
            echo "::error::SITE_S3_BUCKET is not set on this environment. Set it from the company_site_bucket terraform output."
            exit 1
          fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and publish the site
    needs: resolve-env
    uses: WebbPulse/.github/.github/workflows/spa-deploy.yml@v3
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
      node-version: "22"
      working-directory: site
      install-command: >-
        npm ci && npm update $(node -p "const p=require('./package.json');Object.keys({...p.dependencies,...p.devDependencies}).filter(n=>n.startsWith('@webbpulse/')).join(' ')") && { npm ls --depth=0 2>/dev/null | grep @webbpulse || true; }
      cache-dependency-path: site/package-lock.json
      s3-bucket: ${{ needs.resolve-env.outputs.s3-bucket }}
      cloudfront-distribution-id: ${{ needs.resolve-env.outputs.cloudfront-distribution-id }}
      invalidate-cloudfront: false
      aws-region: us-west-2
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      concurrency-group: site-deploy-${{ github.ref_name }}
    secrets:
      role-to-assume: ${{ needs.resolve-env.outputs.role-to-assume }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
