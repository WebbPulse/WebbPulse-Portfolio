# Deploy Backend: the monolith zip deploy, plus the per-domain container image
# build that PR 10 will deploy from.
#
# Two independent jobs. `deploy` is the existing zip pipeline for the monolith
# and is unchanged: it still builds `function.zip`, waits on HCP Terraform, calls
# `update-function-code` and smoke tests `/health`. `build-images` is new, builds
# the four domain images and pushes them to this environment's ECR repositories,
# and updates no function at all. Nothing depends on anything, on purpose: the
# monolith is what serves traffic until PR 10 moves a route, so an image build
# that fails must never hold back or roll back the deploy that does.
#
# `build-images` is the plan's section 4 "Per-domain jobs", minus the deploy half.
# The first run on staging should leave four images in ECR and change no
# behaviour anywhere.
name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The four domain images. Matrix over the domains rather than four copies of
  # one job, `fail-fast: false` so one domain's failure still tells us about the
  # other three: at this stage the point of the job is the information, since
  # nothing consumes the images yet.
  #
  # Runs in the same GitHub Environment as `deploy`, which is what makes
  # `vars.AWS_DEPLOY_ROLE_ARN` resolve at all. That role's trust policy is now
  # `environment:staging` / `environment:production` rather than a branch or a
  # wildcard subject, so a job without the `environment:` key gets a token whose
  # `sub` claim the role refuses. It already carries the three grants this needs:
  # ECR push to the four domain repositories, ECR pull on the shared base image
  # repository in the Artifacts account, and CodeArtifact read.
  #
  # Gated on `BACKEND_IMAGE_BUILD_ENABLED` as well as the existing deploy gate.
  # `container-image.yml@v1` cannot build this Dockerfile yet: it has no BuildKit
  # secret input for the CodeArtifact token, no CodeArtifact login, and its ECR
  # login covers only the caller's own account, so the shared base image in the
  # Artifacts account cannot be pulled. All three are recorded in
  # `docs/migration/container-image-workflow-gaps.md` and all three belong in the
  # org workflow rather than in a fork of it here.
  #
  # The variable exists so that landing the caller does not turn every staging
  # deploy red while that work happens. Set it to "true" once the org workflow
  # ships the three inputs, and this job starts building without another change
  # to this file.
  build-images:
    if: >-
      (github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true')
      && vars.BACKEND_IMAGE_BUILD_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        domain: [content, resume, identity, public]
    # A called workflow cannot hold permissions wider than the caller's grant,
    # and a job level block replaces rather than merges with the top level one,
    # so both are named here even though the top level block already says this.
    # Getting it wrong fails the run before any step, with an error naming the
    # permission rather than the credential.
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    uses: WebbPulse/.github/.github/workflows/container-image.yml@v1
    with:
      # Repository names come from `terraform/ecr.tf`: `name_prefix` is
      # `webbpulse-<environment>` and the four map keys are the domains, so the
      # repository is `webbpulse-<env>/<domain>`. The registry host is not
      # spelled here at all. The reusable workflow logs in with
      # `amazon-ecr-login`, which resolves the caller's own account, so the
      # account id stays out of the repository and staging and production do not
      # drift apart.
      ecr-repository: webbpulse-${{ github.ref_name == 'main' && 'production' || 'staging' }}/${{ matrix.domain }}
      aws-region: us-west-2
      context: backend
      dockerfile: backend/Dockerfile
      # Single platform, matching `terraform/lambda.tf`. Lambda rejects an OCI
      # image index, and the reusable workflow disables provenance and SBOM
      # attestations for the same reason.
      platform: linux/arm64
      # `READINESS_PROTOCOL` is passed explicitly rather than derived, because a
      # reusable workflow has no way to branch a build arg on a matrix value the
      # way `scripts/build_image.sh` branches on its argument. `public` is the
      # one domain whose only `GET /health` reads DynamoDB, so the adapter must
      # not poll a route for it. The Dockerfile rejects the wrong pairing, so a
      # mistake here fails the build rather than shipping an image that only
      # fails later on a cold start that races an unavailable table.
      build-args: |
        DOMAIN=${{ matrix.domain }}
        READINESS_PROTOCOL=${{ matrix.domain == 'public' && 'tcp' || 'http' }}
    secrets:
      role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

  # The digest pinned URIs, collected into the one JSON object PR 10 hands to
  # `lambda-image-deploy.yml` as `function-image-map`. It is written to the job
  # summary rather than passed anywhere, because nothing consumes it yet; making
  # it visible now is what lets PR 10 be a small change instead of a leap.
  #
  # Keyed by function name, `webbpulse-<env>-<domain>`, matching
  # `terraform/lambda.tf`'s naming. `always()` so a partial matrix still reports
  # the domains that did build.
  image-map:
    needs: build-images
    if: always() && needs.build-images.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A matrix of reusable workflow calls collapses to a single `needs` entry
      # whose `outputs` hold only the last job to finish, so the four URIs cannot
      # be read back from `needs`. Rebuilding them from the digest is not
      # possible either. Until the map is actually consumed, the tag is the
      # stable identifier: it is `sha-<full sha>` for every domain, it is
      # immutable, and `PR 10` resolves it to a digest at deploy time.
      - name: Write the image map to the summary
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          RESULT: ${{ needs.build-images.result }}
        run: |
          set -euo pipefail
          {
            echo "## Domain images"
            echo
            echo "Matrix result: \`${RESULT}\`. Tag: \`sha-${GITHUB_SHA}\`."
            echo
            echo "The map PR 10 passes to \`lambda-image-deploy.yml\` as"
            echo "\`function-image-map\`, once the functions exist:"
            echo
            echo '```json'
            python3 - <<'EOF'
          import json, os

          env = os.environ["ENVIRONMENT"]
          sha = os.environ["GITHUB_SHA"]
          domains = ["content", "resume", "identity", "public"]
          print(
              json.dumps(
                  {
                      f"webbpulse-{env}-{d}": f"webbpulse-{env}/{d}:sha-{sha}"
                      for d in domains
                  },
                  indent=2,
              )
          )
          EOF
            echo '```'
            echo
            echo "The registry host is deliberately absent: it is this account's"
            echo "own, resolved at deploy time, so no account id is written down."
          } >> "$GITHUB_STEP_SUMMARY"

  # Unchanged. The monolith zip deploy is what serves traffic, and it must not
  # gain a dependency on the image build: no `needs`, no shared step.
  deploy:
    if: github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-west-2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TFC_ORG: WebbPulse
      TFC_WAIT_ENABLED: ${{ secrets.TFC_API_TOKEN != '' }}
      TFC_WORKSPACE: ${{ github.ref_name == 'main' && 'WebbPulse-Portfolio' || 'WebbPulse-Portfolio-staging' }}
      ARTIFACT_KEY: backend/${{ github.sha }}.zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Moved above the build. `requirements.txt` now pins `webbpulse`, which is
      # published only to CodeArtifact, so `build_lambda.sh` cannot resolve its
      # dependencies without a token. The build used to run first, when
      # everything came from PyPI and nothing before the upload needed AWS.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Writes the CodeArtifact index URL into pip.conf, so it has to run before
      # the build and not merely before the install inside it. The role needs
      # both codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken;
      # without the second, this fails with a denial that names no CodeArtifact
      # action at all.
      - name: Log in to CodeArtifact for pip
        env:
          CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          aws codeartifact login \
            --tool pip \
            --domain webbpulse \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository python

      - name: Build Lambda package
        run: bash backend/scripts/build_lambda.sh

      - name: Upload artifact
        env:
          LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          aws s3 cp backend/dist/function.zip "s3://$LAMBDA_ARTIFACT_BUCKET/$ARTIFACT_KEY"

      - name: Wait for Terraform run to complete
        if: env.TFC_WAIT_ENABLED == 'true'
        env:
          TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          TFC_WORKSPACE_ID=$(curl -sfg \
            -H "Authorization: Bearer $TFC_API_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$TFC_ORG/workspaces/$TFC_WORKSPACE" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['id'])")
          echo "Resolved workspace ID: $TFC_WORKSPACE_ID"

          TERMINAL="applied planned_and_finished discarded errored canceled force_canceled"
          echo "Polling HCP Terraform workspace $TFC_WORKSPACE for active runs..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$TFC_WORKSPACE_ID/runs?page[size]=1")
            STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('data', [])
          print(runs[0]['attributes']['status'] if runs else 'no_runs')
          ")
            echo "  Attempt $i/40 — Terraform run status: $STATUS"
            if echo "$TERMINAL" | grep -qw "$STATUS" || [ "$STATUS" = "no_runs" ]; then
              echo "Terraform is idle. Proceeding."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for Terraform (last status: $STATUS)."
              exit 1
            fi
            sleep 15
          done

      - name: Update Lambda function code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --s3-key "$ARTIFACT_KEY" \
            --publish \
            --query '{Version: Version, CodeSha256: CodeSha256, LastModified: LastModified}' \
            --output table
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      # On staging the health check calls the API host directly: /health sits outside
      # /api/, so it is not reachable through the site origin, and behind the staging
      # access gate the API host only answers requests carrying the origin-verify
      # header, which the deploy role reads from SSM at run time.
      - name: Smoke test
        env:
          API_BASE_URL: ${{ github.ref_name == 'staging' && 'https://api.staging.webbpulse.com' || vars.API_BASE_URL }}
          ORIGIN_VERIFY_PARAMETER: ${{ github.ref_name == 'staging' && '/webbpulse-staging/access-gate/origin-verify' || '' }}
        run: |
          CURL_HEADERS=()
          if [ -n "$ORIGIN_VERIFY_PARAMETER" ]; then
            if VALUE=$(aws ssm get-parameter --with-decryption --name "$ORIGIN_VERIFY_PARAMETER" \
                --query Parameter.Value --output text 2>/dev/null) && [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              CURL_HEADERS=(-H "x-origin-verify: $VALUE")
              echo "Using the staging access gate origin-verify header."
            else
              echo "No origin-verify parameter found; calling the API host without the header."
            fi
          fi
          for i in $(seq 1 10); do
            BODY=$(curl -sS --max-time 20 -w '\n%{http_code}' "${CURL_HEADERS[@]}" "$API_BASE_URL/health" || true)
            CODE=$(echo "$BODY" | tail -n1)
            BODY=$(echo "$BODY" | sed '$d')
            echo "  Attempt $i/10 — HTTP $CODE $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"database"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 6
          done
          echo "Backend did not report healthy."
          exit 1
