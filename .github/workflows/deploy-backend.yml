# Deploy Backend: the monolith zip deploy, and the per-domain container image
# build and deploy beside it.
#
# Two independent chains. `deploy` is the existing zip pipeline for the monolith
# and is unchanged: it still builds `function.zip`, waits on HCP Terraform, calls
# `update-function-code` and smoke tests `/health`. The image chain is
# `resolve-env`, `build-images`, `image-map`, `deploy-images`, `smoke-domains`:
# it builds the four domain images, collects their digest pinned URIs, points the
# four domain functions at them and probes each one. `deploy` depends on none of
# it, on purpose: the monolith is what serves traffic until PR 13 moves a route,
# so an image build or an image deploy that fails must never hold back or roll
# back the deploy that does.
#
# Together the image jobs are the plan's section 4 "Per-domain jobs". Two
# repository variables gate them separately. `BACKEND_IMAGE_BUILD_ENABLED` turns
# on the build, whose enabled run leaves four images in ECR and changes no
# behaviour anywhere. `BACKEND_IMAGE_DEPLOY_ENABLED` turns on the deploy, which
# needs the four functions to exist, so it stays off until PR 9 is applied.
name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - "scripts/verify_route_cut.sh"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The environment scoped values the image jobs need, read in a job that can
  # actually see them.
  #
  # `vars.AWS_DEPLOY_ROLE_ARN` is defined on the GitHub Environment, not at the
  # repository level, so only a job with an `environment:` key resolves it. The
  # `build-images` job cannot have one: it calls a reusable workflow with
  # `uses:`, and that form rejects every key outside a short allowlist. The
  # reusable workflow binds the environment itself, from its `environment`
  # input, but `role-to-assume` is a required secret that the caller must still
  # pass, and the caller is exactly the job that cannot read it.
  #
  # So this job reads it. It runs no build and touches no AWS: it exists to move
  # one environment scoped value into a job output that `build-images` can
  # interpolate. That keeps the ARN on the environment where it belongs, rather
  # than duplicated into a repository level variable where staging and
  # production would drift.
  resolve-env:
    if: >-
      (github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true')
      && vars.BACKEND_IMAGE_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions: {}
    outputs:
      name: ${{ steps.values.outputs.name }}
      role-arn: ${{ steps.values.outputs.role-arn }}
    steps:
      # The ARN is an identifier rather than a credential, and it is held in
      # `vars` rather than `secrets` for that reason, so passing it through a job
      # output discloses nothing that `vars` did not already. A job output cannot
      # carry a secret's masking anyway, which is the other half of why this
      # works only because the value is a var.
      - name: Resolve the environment values
        id: values
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_TO_ASSUME" ]; then
            echo "vars.AWS_DEPLOY_ROLE_ARN is not set on the ${ENVIRONMENT} environment."
            exit 1
          fi
          echo "Environment: ${ENVIRONMENT}"
          echo "name=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "role-arn=${ROLE_TO_ASSUME}" >> "$GITHUB_OUTPUT"

  # The four domain images. Matrix over the domains rather than four copies of
  # one job, `fail-fast: false` so one domain's failure still tells us about the
  # other three: at this stage the point of the job is the information, since
  # nothing consumes the images yet.
  #
  # Runs in the same GitHub Environment as `deploy`, which is what makes the OIDC
  # token's `sub` claim acceptable: the role's trust policy is now
  # `environment:staging` / `environment:production` rather than a branch or a
  # wildcard subject. The environment is bound inside the reusable workflow via
  # the `environment` input rather than by a job level `environment:` key here,
  # because a job that calls a reusable workflow with `uses:` may only carry
  # `name`, `uses`, `with`, `secrets`, `needs`, `if` and `permissions`. Adding
  # `environment:` alongside `uses:` makes GitHub reject the whole workflow file,
  # which fails the run with zero jobs and an error naming no job at all.
  #
  # The role already carries the three grants this needs: ECR push to the four
  # domain repositories, ECR pull on the shared base image repository in the
  # Artifacts account, and CodeArtifact read.
  #
  # Gated on `BACKEND_IMAGE_BUILD_ENABLED` as well as the existing deploy gate.
  # `container-image.yml@v1` now resolves to v1.2.0, which ships the three inputs
  # this Dockerfile needs: the CodeArtifact token as a BuildKit secret, the
  # CodeArtifact login that mints it, and an ECR login covering the Artifacts
  # account so the shared base image the `FROM` pins can be pulled. It also
  # guards the IMMUTABLE tag and uploads a per leg manifest artifact. See
  # `docs/migration/container-image-workflow-gaps.md` for what each one closed.
  #
  # The gate variable stays so the first enabled run is a deliberate act rather
  # than a side effect of a merge. Setting it to "true" is the whole of the
  # remaining change here.
  build-images:
    needs: resolve-env
    strategy:
      fail-fast: false
      matrix:
        domain: [content, resume, identity, public]
    # A called workflow cannot hold permissions wider than the caller's grant,
    # and a job level block replaces rather than merges with the top level one,
    # so both are named here even though the top level block already says this.
    # Getting it wrong fails the run before any step, with an error naming the
    # permission rather than the credential.
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/container-image.yml@v1
    with:
      # Binds the called job to the GitHub Environment, which is what the deploy
      # role's `environment:` OIDC subject requires. It cannot be a job level
      # `environment:` key here, for the reason in the comment above.
      environment: ${{ needs.resolve-env.outputs.name }}
      # Repository names come from `terraform/ecr.tf`: `name_prefix` is
      # `webbpulse-<environment>` and the four map keys are the domains, so the
      # repository is `webbpulse-<env>/<domain>`. The registry host is not
      # spelled here at all. The reusable workflow logs in with
      # `amazon-ecr-login`, which resolves the caller's own account, so the
      # account id stays out of the repository and staging and production do not
      # drift apart.
      ecr-repository: webbpulse-${{ needs.resolve-env.outputs.name }}/${{ matrix.domain }}
      aws-region: us-west-2
      context: backend
      dockerfile: backend/Dockerfile
      # Single platform, matching `terraform/lambda.tf`. Lambda rejects an OCI
      # image index, and the reusable workflow disables provenance and SBOM
      # attestations for the same reason.
      platform: linux/arm64
      # `READINESS_PROTOCOL` is passed explicitly rather than derived, because a
      # reusable workflow has no way to branch a build arg on a matrix value the
      # way `scripts/build_image.sh` branches on its argument. `public` is the
      # one domain whose only `GET /health` reads DynamoDB, so the adapter must
      # not poll a route for it. The Dockerfile rejects the wrong pairing, so a
      # mistake here fails the build rather than shipping an image that only
      # fails later on a cold start that races an unavailable table.
      build-args: |
        DOMAIN=${{ matrix.domain }}
        READINESS_PROTOCOL=${{ matrix.domain == 'public' && 'tcp' || 'http' }}
      # The token is minted after the credentials step and handed to buildx as a
      # BuildKit secret named `codeartifact_token`, which is the id the
      # Dockerfile's `RUN --mount=type=secret,id=codeartifact_token` reads. The
      # default `codeartifact-secret-id` already spells that, so it is not
      # repeated here. It is never a build arg: a build arg lands in
      # `docker history` and is readable by anyone who can pull the image.
      codeartifact-domain: webbpulse
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      codeartifact-repository: python
      # The Artifacts account. The Dockerfile's `FROM` pins the shared
      # `webbpulse/python-lambda-base` image there by digest, and without a
      # Docker credential for that host the pull fails with a 401 that looks
      # nothing like the IAM grant it is not missing. The caller's own account is
      # added by the reusable workflow, so only the second one is named.
      additional-ecr-registries: "432410731887"
      # One JSON manifest per matrix leg, named `image-*`, because a matrix of
      # reusable workflow calls collapses to a single `needs` entry whose
      # `outputs` hold whichever leg finished last. The artifacts are how
      # `image-map` below reads all four digests back.
      upload-manifest-artifact: true
    secrets:
      # From `resolve-env`, not from `vars` directly: this job has no
      # `environment:` key, so it cannot see an environment scoped variable.
      role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}

  # The digest pinned URIs, collected into the one JSON object PR 10 hands to
  # `lambda-image-deploy.yml` as `function-image-map`. Written to the job summary
  # so it is visible on every run, and uploaded as the `function-image-map`
  # artifact so PR 10 can consume it without re-deriving anything.
  #
  # Keyed by function name. PR 9 has not landed on `staging` yet, so
  # `terraform/lambda.tf` still declares only the monolith `${local.prefix}-api`.
  # The names below are the ones `docs/migration/pilot-split-plan.md` section 3.3
  # specifies for the split: `function_name = "${local.prefix}-${each.key}"`,
  # which is `webbpulse-<env>-<domain>`. Once PR 9 lands, that is what Terraform
  # creates, so the key needs no change.
  #
  # `always()` so a partial matrix still reports the domains that did build: the
  # download picks up whatever artifacts the successful legs uploaded, and a
  # missing domain is a missing key rather than a failed job.
  image-map:
    needs: [resolve-env, build-images]
    if: always() && needs.build-images.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      function-image-map: ${{ steps.map.outputs.function-image-map }}
    steps:
      # `merge-multiple: true` lands one JSON file per leg in `manifests/`
      # without a per artifact subdirectory. Each file is named after its
      # artifact, `image-<sanitised repository>-<tag>.json`, so the four cannot
      # collide. Pinned to the same major the org workflow pins its
      # `actions/upload-artifact` to, since the two halves share a format.
      #
      # `continue-on-error` because this job runs under `always()`: if every
      # matrix leg failed there are no `image-*` artifacts at all, and the
      # download errors on finding nothing. The right outcome then is an empty
      # map and a summary saying so, not a second red job restating what
      # `build-images` already reported.
      - name: Download the per-domain image manifests
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: manifests
          pattern: image-*
          merge-multiple: true

      - name: Assemble the function image map
        id: map
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          python3 - <<'PY' > function-image-map.json
          import json, os, pathlib

          env = os.environ["ENVIRONMENT"]
          out = {}
          for path in sorted(pathlib.Path("manifests").glob("*.json")):
              manifest = json.loads(path.read_text())
              # "webbpulse-staging/content" -> "content"
              domain = manifest["repository"].rsplit("/", 1)[-1]
              out[f"webbpulse-{env}-{domain}"] = manifest["image_uri"]
          print(json.dumps(out, indent=2))
          PY
          cat function-image-map.json

          # The step output is the compact form, because it is a workflow output
          # rather than something a person reads.
          MAP=$(python3 -c 'import json,sys; print(json.dumps(json.load(open("function-image-map.json"))))')
          echo "function-image-map=${MAP}" >> "$GITHUB_OUTPUT"

      - name: Write the image map to the summary
        env:
          RESULT: ${{ needs.build-images.result }}
        run: |
          set -euo pipefail
          {
            echo "## Domain images"
            echo
            echo "Matrix result: \`${RESULT}\`. Tag: \`sha-${GITHUB_SHA}\`."
            echo
            echo "The map PR 10 passes to \`lambda-image-deploy.yml\` as"
            echo "\`function-image-map\`, once the functions exist. Every value is"
            echo "pinned by digest, not by tag."
            echo
            echo '```json'
            cat function-image-map.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded so PR 10 can read the map from a prior job rather than rebuild
      # it. The name is fixed, not `image-*`, so the download above never picks
      # its own output up on a rerun.
      - name: Upload the function image map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: function-image-map
          path: function-image-map.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The four domain functions, pointed at the images `image-map` just assembled.
  #
  # This is the deploy half of the plan's section 4 "Per-domain jobs". It calls
  # the org reusable workflow rather than running `update-function-code` here,
  # because that workflow already holds the two things this deploy needs and a
  # hand written step would have to grow: it waits with `function-updated-v2`
  # before the update as well as after, and it retries
  # `ResourceConflictException` with a backoff. Terraform owns the function
  # configuration in this estate, so an apply in flight when a deploy starts is
  # the ordinary case rather than the exceptional one, and while
  # `LastUpdateStatus` is `InProgress` every one of `UpdateFunctionCode`,
  # `UpdateFunctionConfiguration` and `PublishVersion` fails.
  #
  # `function-image-map` goes in as a string input, not as the artifact. The
  # reusable workflow takes only the string form, and it parses it with
  # `json.loads` and rejects anything that is not a non empty JSON object, so
  # the artifact `image-map` uploads stays what it is: a record on the run for a
  # person to read, and the input comes from the job output.
  #
  # `smoke-url` is deliberately not passed. The reusable workflow's smoke test
  # is a `curl` against one URL, and these four functions have no API Gateway
  # route yet: nothing reaches them over HTTP until PR 13 through 16 flip the
  # routes. The probes therefore live in `smoke-domains` below, which invokes
  # each function directly.
  deploy-images:
    needs: [resolve-env, image-map]
    # `image-map` runs under `always()`, so it succeeds with an empty map when
    # every matrix leg failed, and its `result` alone would not catch that. The
    # two string comparisons against `''` and `'{}'` are what make this job skip
    # cleanly in that case rather than handing the reusable workflow a map it
    # rejects with a hard failure: it parses the input with `json.loads` and
    # exits non zero on anything that is not a non empty JSON object. The
    # comparison is textual because a job level `if` cannot call `fromJSON` on a
    # value and get an empty-object test out of it any more cheaply.
    #
    # The gate variable is checked here rather than only inherited through
    # `needs`, because the build gate and the deploy gate are separately
    # settable: the first enabled build run should push four images and update
    # nothing.
    if: >-
      needs.image-map.result == 'success'
      && vars.BACKEND_IMAGE_DEPLOY_ENABLED == 'true'
      && needs.image-map.outputs.function-image-map != ''
      && needs.image-map.outputs.function-image-map != '{}'
    # A called workflow cannot hold permissions wider than the caller's grant,
    # and a job level block replaces rather than merges with the top level one.
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/lambda-image-deploy.yml@v1
    with:
      # Binds the called job to the GitHub Environment, for the same reason
      # `build-images` does: the deploy role's trust policy names
      # `environment:staging` and `environment:production` as the OIDC subject,
      # and a job that calls a reusable workflow with `uses:` may not carry a
      # job level `environment:` key.
      environment: ${{ needs.resolve-env.outputs.name }}
      aws-region: us-west-2
      # Every value here is `<registry>/<repository>@sha256:...`, pinned by
      # digest rather than by tag, and every key is `webbpulse-<env>-<domain>`,
      # which is the `function_name = "${local.prefix}-${each.key}"` that
      # `terraform/lambda_domains.tf` gives the four functions. The map is
      # assembled from the per leg manifests, so a domain whose build failed is
      # simply absent and the other three still deploy.
      function-image-map: ${{ needs.image-map.outputs.function-image-map }}
      # Publish a version per deploy, matching what the monolith's
      # `update-function-code --publish` already does, so a bad image can be
      # rolled back to a numbered version rather than to a tag.
      publish-version: true
      # Named rather than left to the default, which is the workflow name plus
      # the ref. Two deploys for the same environment must not overlap, and the
      # environment is the thing that makes them collide.
      concurrency-group: backend-image-deploy-${{ needs.resolve-env.outputs.name }}
    secrets:
      # From `resolve-env`, not from `vars` directly: this job has no
      # `environment:` key, so it cannot see an environment scoped variable.
      role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}

  # One probe per domain, against the function itself.
  #
  # The plan's section 4 says the smoke test must probe one path per domain, and
  # section 6 says a route flip is only verified when the request actually
  # reaches the new function. Neither is possible over HTTP yet: the four
  # functions have no API Gateway route until PR 13, so a `curl` at
  # `api.staging.webbpulse.com` reaches the monolith and passes whether or not
  # the domain image works at all. That is the false confidence section 4 calls
  # out by name.
  #
  # So the probe is `lambda invoke` with a synthesised API Gateway HTTP API v2
  # payload. The Lambda Web Adapter reads that payload shape directly: it turns
  # `rawPath`, `requestContext.http.method` and the headers into an ordinary
  # HTTP request against `127.0.0.1:$AWS_LWA_PORT` and turns the response back
  # into the `{statusCode, headers, body}` object this step asserts on. Invoking
  # the function is therefore the same code path a real request takes once the
  # route exists, minus the gateway.
  #
  # `GET /health` is the route for all four. `backend/app/composition/wiring.py`
  # gives the three API domains the liveness only `/health` that `create_app`
  # adds, and leaves `public` its own database reading one, so every function
  # serves the path and none of them needs a credential, a body or a path
  # parameter to answer it. It is also the path `AWS_LWA_READINESS_CHECK_PATH`
  # names, so a function that fails this probe would never have passed its own
  # readiness check either.
  #
  # A `public` probe that returns 200 additionally proves the least privilege
  # claim the whole split rests on: `public` has read only DynamoDB and no
  # Secrets Manager access at all, and its `/health` reads the site-content
  # singleton, so a 200 there means the narrow role is sufficient.
  smoke-domains:
    needs: [resolve-env, image-map, deploy-images]
    if: needs.deploy-images.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}
          aws-region: us-west-2

      # One loop rather than four near identical steps: the four probes differ
      # only in the function name, and a loop keeps the assertion in one place.
      # The loop does not stop at the first failure, so a run reports every
      # broken domain rather than only the first alphabetically.
      - name: Probe each domain function
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.name }}
          FUNCTION_IMAGE_MAP: ${{ needs.image-map.outputs.function-image-map }}
        run: |
          set -euo pipefail

          # The payload the Web Adapter expects. `version: "2.0"` is what
          # selects the HTTP API format; the adapter ignores an unknown shape
          # and the invoke then returns a 500 that looks like an application
          # error rather than a malformed event.
          cat > event.json <<'JSON'
          {
            "version": "2.0",
            "routeKey": "GET /health",
            "rawPath": "/health",
            "rawQueryString": "",
            "headers": {
              "accept": "application/json",
              "host": "smoke.invoke.local",
              "user-agent": "webbpulse-deploy-smoke"
            },
            "requestContext": {
              "accountId": "anonymous",
              "apiId": "smoke",
              "domainName": "smoke.invoke.local",
              "http": {
                "method": "GET",
                "path": "/health",
                "protocol": "HTTP/1.1",
                "sourceIp": "127.0.0.1",
                "userAgent": "webbpulse-deploy-smoke"
              },
              "requestId": "smoke",
              "routeKey": "GET /health",
              "stage": "$default",
              "time": "01/Jan/2026:00:00:00 +0000",
              "timeEpoch": 1767225600000
            },
            "isBase64Encoded": false
          }
          JSON

          # Probe only the domains the map actually carries. A domain whose
          # build leg failed was never deployed, so probing it would report a
          # second failure for the same cause.
          FUNCTIONS=$(printf '%s' "$FUNCTION_IMAGE_MAP" \
            | python3 -c 'import json,sys; print("\n".join(sorted(json.load(sys.stdin))))')

          FAILED=0
          while IFS= read -r FUNCTION; do
            [ -n "$FUNCTION" ] || continue
            echo "::group::${FUNCTION} GET /health"

            # A function level error (an unhandled exception, a timeout) sets
            # FunctionError in the response metadata and still exits zero, so
            # the metadata is read rather than trusting the exit status.
            META=$(aws lambda invoke \
              --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload file://event.json \
              --cli-read-timeout 60 \
              response.json)
            echo "$META"

            STATUS=$(python3 -c '
          import json, sys

          try:
              payload = json.load(open("response.json"))
          except (OSError, ValueError):
              print("unparseable")
              sys.exit(0)
          print(payload.get("statusCode", "missing") if isinstance(payload, dict) else "not-an-object")
          ')

            if [ "$STATUS" = "200" ]; then
              echo "${FUNCTION} answered GET /health with 200."
            else
              echo "${FUNCTION} answered GET /health with ${STATUS}, expected 200."
              echo "Response payload:"
              cat response.json
              echo
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "$FUNCTIONS"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more domain functions failed the /health probe."
            exit 1
          fi
          echo "All probed domain functions answered GET /health with 200."

  # Unchanged. The monolith zip deploy is what serves traffic, and it must not
  # gain a dependency on the image build: no `needs`, no shared step.
  deploy:
    if: github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-west-2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TFC_ORG: WebbPulse
      TFC_WAIT_ENABLED: ${{ secrets.TFC_API_TOKEN != '' }}
      TFC_WORKSPACE: ${{ github.ref_name == 'main' && 'WebbPulse-Portfolio' || 'WebbPulse-Portfolio-staging' }}
      ARTIFACT_KEY: backend/${{ github.sha }}.zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Moved above the build. `requirements.txt` now pins `webbpulse`, which is
      # published only to CodeArtifact, so `build_lambda.sh` cannot resolve its
      # dependencies without a token. The build used to run first, when
      # everything came from PyPI and nothing before the upload needed AWS.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Writes the CodeArtifact index URL into pip.conf, so it has to run before
      # the build and not merely before the install inside it. The role needs
      # both codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken;
      # without the second, this fails with a denial that names no CodeArtifact
      # action at all.
      - name: Log in to CodeArtifact for pip
        env:
          CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          aws codeartifact login \
            --tool pip \
            --domain webbpulse \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository python

      - name: Build Lambda package
        run: bash backend/scripts/build_lambda.sh

      - name: Upload artifact
        env:
          LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          aws s3 cp backend/dist/function.zip "s3://$LAMBDA_ARTIFACT_BUCKET/$ARTIFACT_KEY"

      - name: Wait for Terraform run to complete
        if: env.TFC_WAIT_ENABLED == 'true'
        env:
          TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          TFC_WORKSPACE_ID=$(curl -sfg \
            -H "Authorization: Bearer $TFC_API_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$TFC_ORG/workspaces/$TFC_WORKSPACE" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['id'])")
          echo "Resolved workspace ID: $TFC_WORKSPACE_ID"

          TERMINAL="applied planned_and_finished discarded errored canceled force_canceled"
          echo "Polling HCP Terraform workspace $TFC_WORKSPACE for active runs..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$TFC_WORKSPACE_ID/runs?page[size]=1")
            STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('data', [])
          print(runs[0]['attributes']['status'] if runs else 'no_runs')
          ")
            echo "  Attempt $i/40 — Terraform run status: $STATUS"
            if echo "$TERMINAL" | grep -qw "$STATUS" || [ "$STATUS" = "no_runs" ]; then
              echo "Terraform is idle. Proceeding."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for Terraform (last status: $STATUS)."
              exit 1
            fi
            sleep 15
          done

      - name: Update Lambda function code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --s3-key "$ARTIFACT_KEY" \
            --publish \
            --query '{Version: Version, CodeSha256: CodeSha256, LastModified: LastModified}' \
            --output table
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      # On staging the health check calls the API host directly: /health sits outside
      # /api/, so it is not reachable through the site origin, and behind the staging
      # access gate the API host only answers requests carrying the origin-verify
      # header, which the deploy role reads from SSM at run time.
      - name: Smoke test
        env:
          API_BASE_URL: ${{ github.ref_name == 'staging' && 'https://api.staging.webbpulse.com' || vars.API_BASE_URL }}
          ORIGIN_VERIFY_PARAMETER: ${{ github.ref_name == 'staging' && '/webbpulse-staging/access-gate/origin-verify' || '' }}
        run: |
          CURL_HEADERS=()
          if [ -n "$ORIGIN_VERIFY_PARAMETER" ]; then
            if VALUE=$(aws ssm get-parameter --with-decryption --name "$ORIGIN_VERIFY_PARAMETER" \
                --query Parameter.Value --output text 2>/dev/null) && [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              CURL_HEADERS=(-H "x-origin-verify: $VALUE")
              echo "Using the staging access gate origin-verify header."
            else
              echo "No origin-verify parameter found; calling the API host without the header."
            fi
          fi
          for i in $(seq 1 10); do
            BODY=$(curl -sS --max-time 20 -w '\n%{http_code}' "${CURL_HEADERS[@]}" "$API_BASE_URL/health" || true)
            CODE=$(echo "$BODY" | tail -n1)
            BODY=$(echo "$BODY" | sed '$d')
            echo "  Attempt $i/10 — HTTP $CODE $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"database"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 6
          done
          echo "Backend did not report healthy."
          exit 1

  # Section 6's route flip verification, run on every deploy rather than by hand.
  #
  # A cut can apply cleanly, return 200, and have moved nothing, because the
  # route key did not match and API Gateway sent the request to `$default` after
  # all. `scripts/verify_route_cut.sh` is what tells those apart: it asserts the
  # `X-WebbPulse-Domain` response header names the domain being verified rather
  # than `monolith`. Running it here means a regression is caught by the deploy
  # that caused it instead of by the next person to read the plan.
  #
  # THE DOMAIN LIST IS THE ONE THING TO EDIT PER CUT. `DOMAINS` below holds the
  # domains whose routes have actually been cut over. Cut 1 moved `public`, so
  # that is the whole list today. Cuts 2 through 4 each add one word:
  #
  #   DOMAINS="public resume"            after cut 2
  #   DOMAINS="public resume content"    after cut 3
  #   DOMAINS="public resume content identity"   after cut 4
  #
  # A domain added here before its paths exist in the script fails the job with
  # "No paths are defined for domain", which is the intended loud failure: the
  # script exits 2 rather than passing on an empty loop.
  #
  # It is a bash loop rather than a job matrix because a matrix leg is a whole
  # runner, and four legs would each check out the repository and assume the
  # role to run one curl per path. The loop keeps the whole check in one job and
  # still reports every failing domain rather than stopping at the first.
  #
  # `needs` covers both chains, and the guard is written as three explicit
  # result tests rather than a bare `always()`:
  #
  # - `deploy` must have succeeded. It is the monolith that serves `$default`,
  #   so verifying routes against a failed deploy would report a stale surface.
  # - `deploy-images` must not have failed. `smoke-domains` skips when
  #   `deploy-images` fails, so testing only `smoke-domains` would let a broken
  #   image deploy through as a skip.
  # - `smoke-domains` must not have failed. It is allowed to be `skipped`, which
  #   is the ordinary case while `BACKEND_IMAGE_DEPLOY_ENABLED` is off: the
  #   routes still need verifying then, because the `public` function they point
  #   at was deployed by an earlier run.
  verify-route-cuts:
    needs: [deploy, deploy-images, smoke-domains]
    if: >-
      always()
      && needs.deploy.result == 'success'
      && needs.deploy-images.result != 'failure'
      && needs.smoke-domains.result != 'failure'
    runs-on: ubuntu-latest
    # Resolved from the branch the same way `deploy` does it, not from
    # `resolve-env`. That job is gated on `BACKEND_IMAGE_BUILD_ENABLED`, so its
    # outputs are empty on exactly the runs where the image chain is off, and an
    # empty `environment:` would leave `vars.AWS_DEPLOY_ROLE_ARN` unresolvable.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-west-2
      # The credential path is staging only. Production has no access gate, and
      # the script runs there with no header at all, so the parameter name is
      # empty on `main` and the read below is skipped.
      ORIGIN_VERIFY_PARAMETER: ${{ github.ref_name == 'main' && '' || '/webbpulse-staging/access-gate/origin-verify' }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read and masked exactly the way the `deploy` job's smoke test does it,
      # so the value cannot reach a log. `WEBBPULSE_ORIGIN_VERIFY` is the name
      # the script reads; leaving it unset is what production wants, and the
      # script sends no gate header when it is empty.
      - name: Read the staging access gate origin-verify value
        if: env.ORIGIN_VERIFY_PARAMETER != ''
        run: |
          if VALUE=$(aws ssm get-parameter --with-decryption --name "$ORIGIN_VERIFY_PARAMETER" \
              --query Parameter.Value --output text 2>/dev/null) && [ -n "$VALUE" ]; then
            echo "::add-mask::$VALUE"
            echo "WEBBPULSE_ORIGIN_VERIFY=$VALUE" >> "$GITHUB_ENV"
            echo "Using the staging access gate origin-verify header."
          else
            echo "No origin-verify parameter found; calling the API host without the header."
          fi

      - name: Verify each cut domain
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          # Edit this line, and only this line, when a cut lands. See the
          # comment above the job.
          DOMAINS: "public resume content"
        run: |
          set -uo pipefail

          FAILED=0
          for DOMAIN in $DOMAINS; do
            echo "::group::${ENVIRONMENT} ${DOMAIN}"
            if bash scripts/verify_route_cut.sh "$ENVIRONMENT" "$DOMAIN"; then
              echo "The '${DOMAIN}' cut verified."
            else
              echo "The '${DOMAIN}' cut did not verify."
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more route cuts did not verify."
            exit 1
          fi
          echo "Every cut domain is served by its own function."
