name: Test Frontend

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

jobs:
  # Delegated to the org reusable workflow, which runs the same lint, format
  # check, build and test steps this job used to spell out, and additionally
  # logs npm into CodeArtifact before installing so the @webbpulse scoped
  # packages resolve.
  test-frontend:
    permissions:
      # Both are required on the calling job: id-token for the OIDC assume role
      # behind the CodeArtifact login, contents to check the repository out.
      id-token: write
      contents: read
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v1
    with:
      node-version: "20"
      working-directory: frontend
      lint-command: npm run lint
      format-check-command: npm run format:check
      # This repository has no separate type-check script: `npm run build` runs
      # `tsc -b` before vite build, so the build step covers it.
      typecheck-command: ""
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
