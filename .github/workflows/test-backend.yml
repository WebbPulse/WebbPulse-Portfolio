# Backend CI, delegated to the org reusable workflow.
#
# This used to be a hand written job that pip installed from PyPI and ran
# flake8, black and isort. PR 4 adds `webbpulse` to `requirements.txt`, and that
# package is published only to CodeArtifact, so `pip install -r
# requirements-dev.txt` now needs an AWS token before it can resolve anything.
# The reusable workflow already does that login, correctly: it assumes the role
# via OIDC and runs `aws codeartifact login --tool pip` before the install,
# which is the order that matters because the login writes the index URL into
# pip.conf.
#
# Adopting it is PR 8's item on the plan's table, pulled forward here because
# PR 4 is the change that makes CI unable to install its dependencies without
# it. The alternative was a hand rolled login step that PR 8 would then delete.
#
# Two things travel with the adoption:
#
# - **Lint converges on ruff.** The reusable workflow runs `ruff check` and
#   `ruff format --check`, not the flake8/black/isort trio, so `pyproject.toml`
#   now configures ruff and the three old tools are gone from
#   `requirements-dev.txt`. The plan calls this out in section 4: the lint
#   configuration converges in the same pull request that adopts the workflow.
# - **The role comes from a repository variable, not the environment.** The
#   deploy role ARN lives in the `staging` GitHub Environment, whose deployment
#   branch policy admits only the `staging` branch, so a pull request job cannot
#   read it. `vars.CI_AWS_ROLE_ARN` is repository scoped for the same reason
#   `STAGING_DEPLOY_ENABLED` is.
#
# `CI_AWS_ROLE_ARN` now names a dedicated role rather than the deploy role. It
# used to name `webbpulse-staging-github-actions-deploy`, which can update Lambda
# code and push ECR images, and whose trust policy admitted every subject in the
# repository so a pull request branch could assume it. The replacement is
# `webbpulse-staging-github-actions-ci`, whose only permissions are the
# CodeArtifact read grants this job needs, and whose trust names the pull request
# and branch subjects rather than a wildcard.
#
# The variable stays a repository variable rather than becoming a per branch
# selection. The role ARN is deterministic, so the workflow could pick the
# staging or the production account from `github.ref_name`, but there is nothing
# to pick between: this workflow only runs on `pull_request`, every pull request
# check resolves the same read only CodeArtifact package regardless of which
# branch it targets, and the CodeArtifact domain it reads lives in the Artifacts
# account, not in either deploy account. Hard coding a branch conditional would
# add a second account's ARN that no run ever uses, and inlining the ARN would
# put an account id in the repository for no gain. One repository variable
# holding the staging CI role ARN is the smallest thing that is correct.
name: Test Backend

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"

jobs:
  backend:
    # A called workflow cannot hold permissions wider than the caller's grant,
    # and a job level block replaces rather than merges with the top level one,
    # so both have to be named here. Getting this wrong fails the run before any
    # step, with an error naming the permission rather than the credential.
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"
      working-directory: backend
      ruff-target: "app tests"
      coverage-source: app
      pytest-args: "tests/ -v --tb=short"
      codeartifact-domain: webbpulse
      codeartifact-repository: python
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
