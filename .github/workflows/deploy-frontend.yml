# Builds the frontend and publishes it to S3 and CloudFront through the shared
# spa-deploy workflow.
#
# This used to be a hand-rolled build and `aws s3 sync --delete`. That sync set no
# --cache-control, so every object landed in S3 with no Cache-Control metadata at
# all and CloudFront passed that absence through to browsers. With no explicit
# freshness a browser falls back to heuristic caching, so a returning visitor could
# keep serving an index.html from its own disk cache long after a deploy, pointing
# at a hashed bundle that had already been pruned from the bucket. A CloudFront
# invalidation does not help: it clears the edge, not the browser.
#
# The shared workflow fixes that by writing the header at upload time, in three
# passes: hashed assets first with a one year immutable max-age, then the unhashed
# entry documents with no-cache so the browser revalidates on every load, then a
# prune pass for objects from earlier builds. The CloudFront invalidation is
# unchanged.
name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

jobs:
  # A `uses:` job cannot declare an environment, so the environment name is resolved
  # here and passed to the shared workflow as an input.
  resolve-env:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || vars.STAGING_DEPLOY_ENABLED == 'true'
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve-env
    uses: WebbPulse/.github/.github/workflows/spa-deploy.yml@v2
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
      node-version: "20"
      working-directory: frontend
      cache-dependency-path: frontend/package-lock.json
      build-env-json: >-
        ${{ vars.API_BASE_URL != ''
            && format('{{"VITE_API_BASE_URL":"{0}/api/v1"}}', vars.API_BASE_URL)
            || '{}' }}
      s3-bucket: ${{ vars.FRONTEND_S3_BUCKET }}
      cloudfront-distribution-id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      aws-region: us-west-2
      concurrency-group: frontend-deploy-${{ github.ref_name }}
      tfc-organization: WebbPulse
      tfc-workspace: ${{ github.ref_name == 'main' && 'WebbPulse-Portfolio' || 'WebbPulse-Portfolio-staging' }}
    secrets:
      role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      tfc-api-token: ${{ secrets.TFC_API_TOKEN }}
