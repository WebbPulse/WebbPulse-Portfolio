name: E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Backend, Deploy Frontend]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read

jobs:
  e2e:
    name: Verify the deployed environment
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: write
    uses: WebbPulse/.github/.github/workflows/e2e.yml@v3
    with:
      deploy-workflows: "Deploy Backend, Deploy Frontend"
      working-directory: backend
      install-command: uv lock --upgrade-package webbpulse && uv sync --locked --group e2e
      pytest-args: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '-o addopts=' || '-o addopts= -n auto --dist loadgroup' }}
      codeartifact-domain: webbpulse
    secrets:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
