
x-domain-service: &domain-service
  build:
    context: .
    dockerfile: Dockerfile
    secrets:
      - codeartifact_token
  environment: &domain-environment
    ENVIRONMENT: development
    DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    DYNAMODB_TABLE_PREFIX: webbpulse-development
    LOG_LEVEL: INFO
    SECRET_KEY: dev-secret
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: admin
    ADMIN_EMAIL: admin@example.com
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    AWS_DEFAULT_REGION: us-west-2
  depends_on:
    dynamodb-local:
      condition: service_started
  restart: unless-stopped
  profiles: ["domains"]

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: portfolio-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8001:8000"
    volumes:
      - portfolio_dynamodb:/home/dynamodblocal/data
    restart: unless-stopped

  content:
    <<: *domain-service
    container_name: portfolio-content
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN: content
        READINESS_PROTOCOL: http
      secrets:
        - codeartifact_token
    ports:
      - "8010:8080"

  resume:
    <<: *domain-service
    container_name: portfolio-resume
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN: resume
        READINESS_PROTOCOL: http
      secrets:
        - codeartifact_token
    ports:
      - "8011:8080"

  identity:
    <<: *domain-service
    container_name: portfolio-identity
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN: identity
        READINESS_PROTOCOL: http
      secrets:
        - codeartifact_token
    ports:
      - "8012:8080"

  public:
    <<: *domain-service
    container_name: portfolio-public
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN: public
        READINESS_PROTOCOL: tcp
      secrets:
        - codeartifact_token
    ports:
      - "8013:8080"

secrets:
  codeartifact_token:
    environment: CODEARTIFACT_AUTH_TOKEN

volumes:
  portfolio_dynamodb:
