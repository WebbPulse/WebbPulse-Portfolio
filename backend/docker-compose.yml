
x-domain-service: &domain-service
  build:
    context: .
    dockerfile: Dockerfile
    secrets:
      - codeartifact_token
  environment: &domain-environment
    ENVIRONMENT: development
    DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    DYNAMODB_TABLE_PREFIX: webbpulse-development
    LOG_LEVEL: INFO
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    AWS_DEFAULT_REGION: us-west-2
  depends_on:
    dynamodb-local:
      condition: service_started
  restart: unless-stopped
  profiles: ["domains"]

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: portfolio-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8001:8000"
    volumes:
      - portfolio_dynamodb:/home/dynamodblocal/data
    restart: unless-stopped

  public:
    <<: *domain-service
    container_name: portfolio-public
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN: public
      secrets:
        - codeartifact_token
    ports:
      - "8013:8080"

secrets:
  codeartifact_token:
    environment: CODEARTIFACT_AUTH_TOKEN

volumes:
  portfolio_dynamodb:
