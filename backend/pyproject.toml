
[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.webbpulse.ci]
test-root = "tests"

[tool.webbpulse.ci.domains]
content = [
  "tests/test_posts_api.py",
  "tests/test_site_content_api.py",
]
identity = [
  "tests/test_auth_api.py",
  "tests/test_auth_hardening.py",
  "tests/test_core_security.py",
  "tests/test_identity_admin_claims.py",
  "tests/test_identity_m1.py",
  "tests/test_identity_m2.py",
  "tests/test_identity_m3.py",
  "tests/test_identity_m4.py",
  "tests/test_identity_m5.py",
  "tests/test_identity_m6.py",
  "tests/test_credential_migration.py",
  "tests/test_clear_legacy_credentials.py",
  "tests/test_security_compat.py",
  "tests/test_seed_identity_aware.py",
]
public = [
  "tests/test_seo.py",
]
resume = [
  "tests/test_certifications_api.py",
  "tests/test_education_api.py",
  "tests/test_experience_api.py",
  "tests/test_projects_api.py",
  "tests/test_skills_api.py",
]
