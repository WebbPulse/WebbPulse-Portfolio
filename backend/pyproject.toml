# Lint and format configuration.
#
# This replaced the flake8, black and isort trio in PR 4, because the org
# reusable workflow `python-ci.yml@v1` runs `ruff check` and
# `ruff format --check` and PR 4 has to adopt that workflow to reach the
# `webbpulse` package in CodeArtifact. The plan's section 4 anticipates the
# pairing: the lint configuration converges in the same pull request that
# adopts the workflow.
#
# The settings below are chosen to keep the existing formatting rather than to
# reformat the tree. `ruff format` is black compatible and the line length is
# black's 88, so the format check passes on the current source unchanged, and
# the lint rules are the ones flake8 and isort were already enforcing.

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
# Deliberately the same surface the old tools covered and no more: E and F are
# pycodestyle and pyflakes, which is what flake8 ran, and I is isort, which ruff
# enforces in the same pass rather than as a second tool.
#
# `B` (bugbear) and `UP` (pyupgrade) are the obvious additions and are left off
# on purpose. Turning them on flags 196 findings across the existing tree, most
# of them `Optional[str]` versus `str | None` and `datetime.timezone.utc`
# versus `datetime.UTC`, and `B008` flags FastAPI's own `Depends()` idiom on
# every route signature. Fixing all of that here would bury a composition change
# under a whole tree reformat, and reviewing it would mean reading 200 hunks to
# find the four that matter. It is a good follow up on its own.
select = ["E", "F", "I"]
# E203 is whitespace before a colon, which the formatter itself produces in
# slices; it was in the flake8 `extend-ignore` for exactly that reason. W503 has
# no ruff equivalent, because ruff never had the line break rule flake8 needed
# turning off in the first place.
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets the test environment before importing anything that reads
# it, so its imports are deliberately not at the top of the file.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Per-domain CI. The organisation's reusable python-ci.yml reads this table and
# runs one pytest job per domain, so wall clock time tracks the largest domain
# rather than the sum of all four. Adding a domain here is the whole change: the
# workflow discovers it, and the branch ruleset requires `all-checks-passed`
# rather than the matrix job names, so neither has to be edited.
#
# The convention is specified and tested in the shared package as `webbpulse.ci`.
# Paths are relative to this directory, which is the workflow's working-directory.
#
# These lists name files rather than directories because `tests/` is flat: the
# suite predates the domain split and moving 30 files into four folders would
# bury a CI change under a rename. A file may be named directly for exactly that
# reason.
#
# Anything not listed here runs in the `shared` job, which sweeps `tests/` with an
# --ignore per claimed path. So forgetting to claim a new file makes it run in
# `shared`, which is slower but never silent. tests/entrypoints/ is deliberately
# left to `shared`: those suites assert across every domain's wiring at once, so
# they belong to no single one.
[tool.webbpulse.ci]
test-root = "tests"

[tool.webbpulse.ci.domains]
content = [
  "tests/test_posts_api.py",
  "tests/test_site_content_api.py",
]
identity = [
  "tests/test_auth_api.py",
  "tests/test_auth_hardening.py",
  "tests/test_core_security.py",
  "tests/test_identity_admin_claims.py",
  "tests/test_identity_m1.py",
  "tests/test_identity_m2.py",
  "tests/test_identity_m3.py",
  "tests/test_identity_m4.py",
  "tests/test_identity_m5.py",
  "tests/test_identity_m6.py",
  "tests/test_credential_migration.py",
  "tests/test_clear_legacy_credentials.py",
  "tests/test_security_compat.py",
  "tests/test_seed_identity_aware.py",
]
public = [
  "tests/test_seo.py",
]
resume = [
  "tests/test_certifications_api.py",
  "tests/test_education_api.py",
  "tests/test_experience_api.py",
  "tests/test_projects_api.py",
  "tests/test_skills_api.py",
]
