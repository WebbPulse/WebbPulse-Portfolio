[project]
name = "webbpulse-portfolio-backend"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "webbpulse[fastapi,dynamodb,otel,aws-otel,security,identity,oauth,passkeys]>=0.28.1,<1",
  "fastapi>=0.141.1",
  "boto3>=1.43.90",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "python-slugify>=8.0.4",
  "email-validator>=2.3.0",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
e2e = [
  "webbpulse[e2e,fastapi,dynamodb,identity,oauth,passkeys,security]>=0.29.0,<1",
  "fastapi>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "python-slugify>=8.0.4",
  "email-validator>=2.3.0",
]
dev = [
  "webbpulse[testing]>=0.28.1,<1",
  "moto[dynamodb]>=5.2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "httpx>=0.28.1",
  "psycopg2-binary>=2.9.12",
  "ruff>=0.16.6",
  "pyright>=1.1.408",
  "bandit>=1.9.2",
  "pip-audit>=2.9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "codeartifact"
url = "https://webbpulse-432410731887.d.codeartifact.us-west-2.amazonaws.com/pypi/python/simple/"
explicit = true

[tool.uv.sources]
webbpulse = { index = "codeartifact" }


[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]

exclude_dirs = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.webbpulse.ci]
test-root = "tests"
domains-root = "tests/domains"
entrypoints = "app/entrypoints"
